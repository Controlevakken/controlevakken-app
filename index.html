<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controlevakken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html, body {
  width:100%;
  height:100%;
  margin:0;
  overscroll-behavior: contain;
}

body {
  font-family:Arial;
  background:#f3f4f6;
  touch-action: manipulation;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:12px;
  box-sizing:border-box;
  text-align:center;
}

/* VOL overlay */
#vol{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:clamp(48px,10vw,96px);
  font-weight:900;
  color:#c00;
  background:rgba(255,255,255,0.55);
  pointer-events:none;
  z-index:9999;
}

.advice{
  font-weight:900;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:clamp(16px,3.5vw,22px);
}
.advice.more{ background:#16a34a; color:#fff; }
.advice.less{ background:#dc2626; color:#fff; }

/* Middle vult resterende hoogte */
.middle{
  flex:1;
  display:flex;
  align-items:stretch;
}

/* RESPONSIVE GRID */
.grid{
  width:100%;
  height:100%;
  display:grid;
  gap:12px;
  grid-template-columns: repeat(3, 1fr);
}

/* Telefoon */
@media (max-width: 600px){
  .grid{
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Tablet portrait */
@media (min-width: 601px) and (max-width: 900px){
  .grid{
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Tablet landscape / groot */
@media (min-width: 901px){
  .grid{
    grid-template-columns: repeat(4, 1fr);
  }
}

.box{
  aspect-ratio:1 / 1;
  border-radius:16px;
  color:white;
  font-size:clamp(20px,3vw,32px);
  font-weight:bold;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
}

.box.highlight{
  border:6px solid #facc15;
  box-shadow:0 0 20px rgba(250,204,21,1), inset 0 0 10px rgba(250,204,21,0.8);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(250,204,21,.6);}
  50%{box-shadow:0 0 25px rgba(250,204,21,1);}
  100%{box-shadow:0 0 10px rgba(250,204,21,.6);}
}

.time{
  font-size:clamp(12px,2vw,15px);
  margin-top:4px;
}

button{
  padding:10px 14px;
  font-size:16px;
  margin:4px;
}
</style>
</head>

<body>
<div id="vol">VOL</div>

<div class="app">

  <div id="advice" class="advice more">MEER TOEVOER</div>

  <div>
    <h2>Controlevakken</h2>
    <div id="longestFree" style="font-weight:bold; margin-bottom:6px;">Langst vrij: —</div>
    <button onclick="addBox()">+ Vak</button>
    <button onclick="removeBox()">- Vak</button>
    <button onclick="resetAll()">Reset vakken</button>
  </div>

  <div class="middle">
    <div id="grid" class="grid"></div>
  </div>

  <div>
    <p><b>Gemiddelde duur controle:</b> <span id="avg">0:00</span></p>

    <p><b>automatische teller</b></p>
    <p>Aantal vtg gecontroleerd: <b id="count">0</b></p>

    <p><b>handmatige teller</b></p>
    <button onclick="manualChange(1)">+</button>
    <button onclick="manualChange(-1)">-</button>

    <div style="margin-top:10px;">
      <button onclick="resetCounter()">Reset teller</button>
      <button onclick="downloadReport()">Download eindrapport</button>
    </div>
  </div>
</div>

<!-- JS is ongewijzigd -->
<script>
/* jouw bestaande JS blijft exact hetzelfde */
</script>

</body>
</html>
