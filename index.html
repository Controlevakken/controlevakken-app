<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controlevakken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html, body{height:100%;margin:0}
body{
  font-family:Arial;
  background:#f3f4f6;
  color:#000;
}
body.dark{background:#000;color:#fff}
body.dark p, body.dark h2, body.dark button{color:#fff}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:10px;
  box-sizing:border-box;
  text-align:center;
}

/* ADVIES */
.advice{
  font-weight:900;
  padding:8px;
  border-radius:10px;
  margin-bottom:4px;
}
.advice.more{background:#16a34a;color:#fff}
.advice.less{background:#dc2626;color:#fff}

/* LANGST VRIJ */
#longestFree{
  padding:8px;
  margin-bottom:4px;
  border-radius:10px;
  background:#e5e7eb;
  font-weight:900;
}
body.dark #longestFree{background:#1f2933}

/* GRID */
.middle{flex:1;display:flex}
.grid{
  width:100%;
  height:100%;
  display:grid;
  gap:12px;
  grid-template-columns:repeat(3,1fr);
}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:901px){.grid{grid-template-columns:repeat(4,1fr)}}

/* VAKKEN (ONGEWJZIGD) */
.box{
  aspect-ratio:1/1;
  border-radius:16px;
  color:white;
  font-size:28px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box.highlight{
  border:6px solid #facc15;
  box-shadow:0 0 20px rgba(250,204,21,1);
}

button{margin:4px;padding:10px 14px;font-size:16px}
</style>
</head>

<body>
<div class="app">

  <div id="advice" class="advice more">MEER TOEVOER</div>
  <div id="longestFree">Langst vrij → —</div>

  <h2>Controlevakken</h2>

  <div class="middle">
    <div id="grid" class="grid"></div>
  </div>

  <div>
    <p>Gemiddelde duur: <span id="avg">0:00</span></p>
    <p>Aantal voertuigen: <b id="count">0</b></p>

    <button onclick="addBox()">+ Vak</button>
    <button onclick="removeBox()">- Vak</button>
    <button onclick="toggleTheme()">Dag / Avond</button>
  </div>
</div>

<script>
/* FIREBASE – VOLLEDIG */
const firebaseConfig = {
  apiKey: "AIzaSyB5ZIsNVDFoQ2rtb7nysrs-vSFikz-AvbM",
  authDomain: "controlevakken-teller.firebaseapp.com",
  projectId: "controlevakken-teller",
  storageBucket: "controlevakken-teller.firebasestorage.app",
  messagingSenderId: "507012510405",
  appId: "1:507012510405:web:88d4817f6658e94feb76ac"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("counter").doc("main");

const BASE=6, FULL_RATIO=0.75;
let active=[], greenSince=[];

/* THEMA */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* GRID */
function buildGrid(){
  const g=document.getElementById("grid");
  g.innerHTML="";
  active.forEach((_,i)=>{
    const b=document.createElement("div");
    b.className="box";
    b.onclick=()=>toggle(i);
    g.appendChild(b);
  });
}

function draw(){
  let red=0,max=-1,hi=-1;
  active.forEach((r,i)=>{
    if(r) red++;
    if(!r && greenSince[i]){
      const t=Date.now()-greenSince[i];
      if(t>max){max=t;hi=i;}
    }
  });

  document.getElementById("advice").innerText =
    red/active.length>=FULL_RATIO?"MINDER TOEVOER":"MEER TOEVOER";

  document.getElementById("longestFree").innerText =
    hi>=0?`Langst vrij → Vak ${hi+1}`:"Langst vrij → —";

  document.querySelectorAll(".box").forEach((b,i)=>{
    b.style.background=active[i]?"red":"green";
    b.classList.toggle("highlight",i===hi);
    b.innerText=i+1;
  });
}

function toggle(i){
  active[i]=!active[i];
  greenSince[i]=Date.now();
  docRef.update({boxes:active,greenSince});
}

function addBox(){
  active.push(false);
  greenSince.push(Date.now());
  docRef.set({boxes:active,greenSince},{merge:true});
}

function removeBox(){
  if(active.length<=1)return;
  active.pop();greenSince.pop();
  docRef.update({boxes:active,greenSince});
}

/* 🔑 DIT WAS DE MISSENDE SCHAKEL */
docRef.onSnapshot(doc=>{
  if(doc.exists){
    const d=doc.data();
    active=d.boxes||Array(BASE).fill(false);
    greenSince=d.greenSince||Array(active.length).fill(Date.now());
  }else{
    active=Array(BASE).fill(false);
    greenSince=Array(BASE).fill(Date.now());
    docRef.set({boxes:active,greenSince});
  }
  buildGrid();
  draw();
});

setInterval(draw,1000);
</script>
</body>
</html>
