<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controlevakken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  font-family:Arial;
  background:#f3f4f6;
  color:#000;
}

/* AVOND */
body.dark{
  background:#000;
  color:#fff;
}
body.dark button{
  background:#222;
  color:#fff;
  border:1px solid #555;
}

/* APP */
.app{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:10px;
  box-sizing:border-box;
  text-align:center;
}

/* ADVIES */
.advice{
  font-weight:900;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
}
.advice.more{ background:#16a34a; color:#fff; }
.advice.less{ background:#dc2626; color:#fff; }

/* LANGST VRIJ */
#longestFree{
  margin:0 0 6px 0;
  padding:8px;
  border-radius:10px;
  background:#e5e7eb;
  font-weight:900;
}
body.dark #longestFree{
  background:#1f2933;
}

/* GRID */
.middle{flex:1;display:flex;}
.grid{
  width:100%;
  height:100%;
  display:grid;
  gap:12px;
  grid-template-columns:repeat(3,1fr);
}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:901px){.grid{grid-template-columns:repeat(4,1fr);}}

/* BOXEN */
.box{
  aspect-ratio:1/1;
  border-radius:16px;
  color:white;
  font-size:clamp(20px,3vw,32px);
  font-weight:bold;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* DONKERDER GROEN VOOR PRIORITY */
.box.priority{
  background:#15803d !important;
}

/* GELE RAND (zoals origineel) */
.box.highlight{
  border:6px solid #facc15;
  box-shadow:0 0 20px rgba(250,204,21,1),
             inset 0 0 10px rgba(250,204,21,.8);
  animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(250,204,21,.6);}
  50%{box-shadow:0 0 25px rgba(250,204,21,1);}
  100%{box-shadow:0 0 10px rgba(250,204,21,.6);}
}

.time{font-size:14px;margin-top:4px;}

button{
  padding:10px 14px;
  font-size:16px;
  margin:4px;
}
</style>
</head>

<body>
<div class="app">

<div id="advice" class="advice more">MEER TOEVOER</div>
<div id="longestFree">Langst vrij → —</div>

<h2>Controlevakken</h2>

<div class="middle">
<div id="grid" class="grid"></div>
</div>

<div>
<p>Gemiddelde duur controle: <span id="avg">0:00</span></p>
<p>Aantal vtg gecontroleerd: <b id="count">0</b></p>

<button onclick="manualChange(1)">+</button>
<button onclick="manualChange(-1)">-</button>

<div style="margin-top:8px;">
<button onclick="toggleTheme()">Dag / Avond</button>
<button onclick="resetCounter()">Reset teller</button>
<button onclick="downloadReport()">Download eindrapport</button>
</div>
</div>

</div>

<script>
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* FIREBASE */
const firebaseConfig={
  apiKey:"AIzaSyB5ZIsNVDFoQ2rtb7nysrs-vSFikz-AvbM",
  authDomain:"controlevakken-teller.firebaseapp.com",
  projectId:"controlevakken-teller",
  storageBucket:"controlevakken-teller.firebasestorage.app",
  messagingSenderId:"507012510405",
  appId:"1:507012510405:web:88d4817f6658e94feb76ac"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const docRef=db.collection("counter").doc("main");

const BASE=6, FULL_RATIO=0.75, MIN_VALID_RED=10000;

let active=[], redSince=[], greenSince=[];
let vakStart=[], vakVehicles=[];
let totalTime=0, totalCount=0;
let startTime=Date.now();

/* GRID */
function buildGrid(){
  const g=document.getElementById("grid");
  g.innerHTML="";
  active.forEach((_,i)=>{
    const b=document.createElement("div");
    b.className="box";
    b.onclick=()=>toggle(i);
    g.appendChild(b);
  });
}

function draw(){
  let red=0,max=-1,hi=-1;
  active.forEach((r,i)=>{
    if(r) red++;
    if(!r && greenSince[i]){
      const t=Date.now()-greenSince[i];
      if(t>max){max=t;hi=i;}
    }
  });

  const advice=(red/active.length>=FULL_RATIO)?"MINDER TOEVOER":"MEER TOEVOER";
  const a=document.getElementById("advice");
  a.className="advice "+(advice==="MINDER TOEVOER"?"less":"more");
  a.innerText=advice;

  document.getElementById("longestFree").innerText=
    hi>=0?`Langst vrij → Vak ${hi+1}`:"Langst vrij → —";

  document.querySelectorAll(".box").forEach((b,i)=>{
    b.classList.remove("priority");
    b.classList.remove("highlight");

    const r=active[i];
    b.style.background=r?"red":"green";

    if(!r && i===hi){
      b.classList.add("priority");
      b.classList.add("highlight");
    }

    let txt=i+1;
    if(r && redSince[i]) txt+=`<div class="time">🔴 ${fmt(Date.now()-redSince[i])}</div>`;
    if(!r && greenSince[i]) txt+=`<div class="time">🟢 ${fmt(Date.now()-greenSince[i])}</div>`;
    b.innerHTML=txt;
  });

  document.getElementById("avg").innerText=
    totalCount?fmt(totalTime/totalCount):"0:00";
}

function toggle(i){
  const now=Date.now();
  if(!active[i]){
    redSince[i]=now;
    greenSince[i]=null;
  }else{
    if(redSince[i]){
      const d=now-redSince[i];
      if(d>=MIN_VALID_RED){
        vakVehicles[i]++;
        totalTime+=d; totalCount++;
        docRef.update({ value:firebase.firestore.FieldValue.increment(1) });
      }
    }
    redSince[i]=null;
    greenSince[i]=now;
  }
  active[i]=!active[i];
  docRef.update({ boxes:active, redSince, greenSince, vakStart, vakVehicles, totalTime, totalCount });
}

function manualChange(a){
  docRef.update({ value:firebase.firestore.FieldValue.increment(a) });
}

function resetCounter(){
  startTime=Date.now();
  vakStart=active.map(()=>startTime);
  vakVehicles=active.map(()=>0);
  totalTime=0; totalCount=0;
  docRef.update({ value:0, startTime, vakStart, vakVehicles, totalTime, totalCount });
}

function downloadReport(){
  const end=new Date();
  let details="";
  active.forEach((_,i)=>{
    details+=`Vak ${i+1}:
Start: ${new Date(vakStart[i]).toLocaleString()}
Eind: ${end.toLocaleString()}
Voertuigen: ${vakVehicles[i]}

`;
  });

  const txt=
`LOGBOEK VERKEERSCONTROLE
Start: ${new Date(startTime).toLocaleString()}
Einde: ${end.toLocaleString()}

${details}`;

  const blob=new Blob([txt],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`logboek_${end.toISOString().slice(0,19).replace(/[:T]/g,"-")}.txt`;
  a.click();
}

function fmt(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60);
  return `${m}:${(s%60).toString().padStart(2,"0")}`;
}

docRef.onSnapshot(doc=>{
  if(doc.exists){
    const d=doc.data();
    active=d.boxes||Array(BASE).fill(false);
    redSince=d.redSince||Array(active.length).fill(null);
    greenSince=d.greenSince||Array(active.length).fill(Date.now());
    vakStart=d.vakStart||Array(active.length).fill(Date.now());
    vakVehicles=d.vakVehicles||Array(active.length).fill(0);
    totalTime=d.totalTime||0;
    totalCount=d.totalCount||0;
    document.getElementById("count").innerText=d.value||0;
  }
  buildGrid();
  draw();
});

setInterval(draw,1000);
</script>
</body>
</html>
