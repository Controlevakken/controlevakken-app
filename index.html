<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controlevakken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html, body { width:100%; height:100%; margin:0; overscroll-behavior: contain; }
body { font-family:Arial; background:#f3f4f6; touch-action: manipulation; }

.app{
  width:100%; height:100%;
  display:flex; flex-direction:column;
  justify-content:space-between;
  padding:16px; box-sizing:border-box;
  text-align:center;
}

/* VOL op voorgrond */
#vol{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  font-size:clamp(48px,10vw,96px);
  font-weight:900; color:#c00;
  background:rgba(255,255,255,.92);
  pointer-events:none; z-index:9999;
}

.advice{
  font-weight:900;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:clamp(16px,4vw,22px);
}
.advice.more{ background:#16a34a; color:#fff; }
.advice.less{ background:#dc2626; color:#fff; }

.middle{ flex-grow:1; display:flex; align-items:center; justify-content:center; }

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap:12px;
  width:100%;
  max-width:420px;
  margin:0 auto;
}

/* Vak */
.box{
  aspect-ratio:1/1;              /* altijd vierkant */
  border-radius:14px;
  color:white;
  font-size:clamp(18px,4vw,26px);
  font-weight:bold;
  box-sizing:border-box;
  position:relative;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;

  -webkit-tap-highlight-color: transparent;
  user-select:none;
}

.box.highlight{
  border:6px solid #facc15;
  box-shadow:0 0 20px rgba(250,204,21,1), inset 0 0 10px rgba(250,204,21,0.8);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(250,204,21,.6);}
  50%{box-shadow:0 0 25px rgba(250,204,21,1);}
  100%{box-shadow:0 0 10px rgba(250,204,21,.6);}
}

.time{
  font-size:clamp(11px,2.5vw,14px);
  font-weight:normal;
  margin-top:4px;
}

button{ padding:10px 14px; font-size:16px; margin:4px; }
</style>
</head>

<body>
<div id="vol">VOL</div>

<div class="app">

  <div id="advice" class="advice more">MEER TOEVOER</div>

  <div>
    <h2>Controlevakken</h2>
    <div id="longestFree" style="font-weight:bold; margin-bottom:6px;">Langst vrij: —</div>
    <button onclick="addBox()">+ Vak</button>
    <button onclick="removeBox()">- Vak</button>
    <button onclick="resetAll()">Reset vakken</button>
  </div>

  <div class="middle">
    <div id="grid" class="grid"></div>
  </div>

  <div>
    <p><b>Gemiddelde duur controle:</b> <span id="avg">0:00</span></p>

    <p><b>automatische teller</b></p>
    <p>Aantal vtg gecontroleerd: <b id="count">0</b></p>

    <p><b>handmatige teller</b></p>
    <button onclick="manualChange(1)">+</button>
    <button onclick="manualChange(-1)">-</button>

    <div style="margin-top:10px;">
      <button onclick="resetCounter()">Reset teller</button>
      <button onclick="downloadReport()">Download eindrapport</button>
    </div>
  </div>
</div>

<script>
/* JS blijft gelijk aan de stabiele versie die je al hebt */
</script>
</body>
</html>
