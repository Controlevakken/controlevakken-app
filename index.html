<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controlevakken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html, body{
  width:100%;
  height:100%;
  margin:0;
}
body{
  font-family:Arial;
  background:#f3f4f6;
  color:#000;
}

/* AVONDMODUS */
body.dark{
  background:#000;
  color:#fff;
}
body.dark h2,
body.dark p,
body.dark button,
body.dark #longestFree{
  color:#fff;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:10px;
  box-sizing:border-box;
  text-align:center;
}

/* ADVIES */
.advice{
  font-weight:900;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
  font-size:clamp(16px,3.5vw,22px);
}
.advice.more{ background:#16a34a; color:#fff; }
.advice.less{ background:#dc2626; color:#fff; }

/* LANGST VRIJ – HIGHLIGHT */
#longestFree{
  margin:4px 0 6px 0;
  padding:8px;
  border-radius:10px;
  background:#e5e7eb;
  font-weight:900;
  font-size:clamp(18px,4vw,24px);
}
body.dark #longestFree{
  background:#1f2933;
}

/* TITEL BLOK */
.top-controls h2{
  margin:4px 0 4px 0;
}

/* GRID */
.middle{
  flex:1;
  display:flex;
}
.grid{
  width:100%;
  height:100%;
  display:grid;
  gap:12px;
  grid-template-columns:repeat(3,1fr);
}
@media (max-width:600px){
  .grid{ grid-template-columns:repeat(2,1fr); }
}
@media (min-width:901px){
  .grid{ grid-template-columns:repeat(4,1fr); }
}

/* VAKKEN – NIET AANGEPAST */
.box{
  aspect-ratio:1/1;
  border-radius:16px;
  color:white;
  font-size:clamp(20px,3vw,32px);
  font-weight:bold;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.box.highlight{
  border:6px solid #facc15;
  box-shadow:0 0 20px rgba(250,204,21,1);
}

.time{
  font-size:14px;
  margin-top:4px;
}

/* ONDERIN */
button{
  padding:10px 14px;
  font-size:16px;
  margin:4px;
}
</style>
</head>

<body>
<div class="app">

  <div id="advice" class="advice more">MEER TOEVOER</div>

  <div id="longestFree">Langst vrij → —</div>

  <div class="top-controls">
    <h2>Controlevakken</h2>
    <button onclick="addBox()">+ Vak</button>
    <button onclick="removeBox()">- Vak</button>
    <button onclick="resetAll()">Reset vakken</button>
  </div>

  <div class="middle">
    <div id="grid" class="grid"></div>
  </div>

  <div>
    <p><b>Gemiddelde duur:</b> <span id="avg">0:00</span></p>
    <p>Aantal voertuigen: <b id="count">0</b></p>

    <button onclick="manualChange(1)">+</button>
    <button onclick="manualChange(-1)">-</button>

    <div style="margin-top:8px;">
      <button onclick="toggleTheme()">Dag / Avond</button>
      <button onclick="resetCounter()">Reset teller</button>
      <button onclick="downloadReport()">Download eindrapport</button>
    </div>
  </div>
</div>

<script>
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* === BESTAANDE JS – ONGEWIJZIGD === */
const firebaseConfig = {
  apiKey: "AIzaSyB5ZIsNVDFoQ2rtb7nysrs-vSFikz-AvbM",
  authDomain: "controlevakken-teller.firebaseapp.com",
  projectId: "controlevakken-teller"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const docRef=db.collection("counter").doc("main");

const BASE=6, FULL_RATIO=0.75, MIN_VALID_RED=10000;
let active=[], redSince=[], greenSince=[];
let totalTime=0, totalCount=0;

function buildGrid(){
  const g=document.getElementById("grid");
  g.innerHTML="";
  active.forEach((_,i)=>{
    const b=document.createElement("div");
    b.className="box";
    b.onclick=()=>toggle(i);
    g.appendChild(b);
  });
}

function draw(){
  let red=0, max=-1, hi=-1;
  active.forEach((r,i)=>{
    if(r) red++;
    if(!r && greenSince[i]){
      const t=Date.now()-greenSince[i];
      if(t>max){max=t;hi=i;}
    }
  });

  document.getElementById("advice").innerText =
    red/active.length>=FULL_RATIO ? "MINDER TOEVOER" : "MEER TOEVOER";

  document.getElementById("longestFree").innerText =
    hi>=0 ? `Langst vrij → Vak ${hi+1}` : "Langst vrij → —";

  document.querySelectorAll(".box").forEach((b,i)=>{
    const r=active[i];
    b.style.background=r?"red":"green";
    b.classList.toggle("highlight",i===hi);
    b.innerHTML=i+1;
  });
}

function toggle(i){
  const now=Date.now();
  active[i]=!active[i];
  if(active[i]) redSince[i]=now; else greenSince[i]=now;
  docRef.update({boxes:active,redSince,greenSince});
}

function addBox(){
  active.push(false);
  redSince.push(null);
  greenSince.push(Date.now());
  buildGrid();
}
function removeBox(){
  if(active.length<=1) return;
  active.pop(); redSince.pop(); greenSince.pop();
  buildGrid();
}
function resetAll(){
  active.fill(false);
  greenSince.fill(Date.now());
}
function manualChange(a){
  docRef.update({value:firebase.firestore.FieldValue.increment(a)});
}
function resetCounter(){
  totalTime=0; totalCount=0;
}

setInterval(draw,1000);
buildGrid();
</script>

</body>
</html>
