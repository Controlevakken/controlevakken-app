<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controlevakken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html, body { width:100%; height:100%; margin:0; }
body { font-family:Arial; background:#f3f4f6; }

.app{
  width:100%; height:100%;
  display:flex; flex-direction:column;
  justify-content:space-between;
  padding:20px; box-sizing:border-box;
  text-align:center;
}

.middle{ flex-grow:1; display:flex; align-items:center; justify-content:center; position:relative; }

.grid{
  display:grid;
  grid-template-rows: repeat(4, auto);
  grid-auto-flow: column;
  gap:12px;
  width:100%;
  max-width:400px;
  margin:0 auto;
}

.box{
  height:90px; border-radius:12px; color:white;
  font-size:24px; font-weight:bold; border:none;
}

button{ padding:10px 14px; font-size:16px; margin:4px; }

#vol{
  position:absolute; inset:0;
  display:none; align-items:center; justify-content:center;
  font-size:64px; font-weight:900; color:#c00;
  background:rgba(255,255,255,.8);
  pointer-events:none;
}

.plus{
  position:fixed; right:20px; bottom:120px;
  font-size:28px; color:#16a34a; font-weight:900;
  animation: pop 600ms ease-out forwards;
}
@keyframes pop{
  from{ transform:translateY(10px); opacity:0; }
  to{ transform:translateY(-20px); opacity:1; }
}
</style>
</head>

<body>
<div class="app">
  <div>
    <h2>Controlevakken</h2>
    <button onclick="addBox()">+ Vak</button>
    <button onclick="removeBox()">- Vak</button>
    <button onclick="resetAll()">Reset vakken</button>
  </div>

  <div class="middle">
    <div id="vol">VOL</div>
    <div id="grid" class="grid"></div>
  </div>

  <div>
    <p><b>Gemiddelde duur controle:</b> <span id="avg">0:00</span></p>
    <p>Laatst bijgewerkt: <span id="last">—</span></p>

    <p><b>automatische teller</b></p>
    <p>Aantal vtg gecontroleerd: <b id="count">0</b></p>

    <p><b>handmatige teller</b></p>
    <button onclick="manualChange(1)">+</button>
    <button onclick="manualChange(-1)">-</button>

    <div style="margin-top:10px;">
      <button onclick="resetCounter()">Reset teller</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5ZIsNVDFoQ2rtb7nysrs-vSFikz-AvbM",
  authDomain: "controlevakken-teller.firebaseapp.com",
  projectId: "controlevakken-teller",
  storageBucket: "controlevakken-teller.firebasestorage.app",
  messagingSenderId: "507012510405",
  appId: "1:507012510405:web:88d4817f6658e94feb76ac"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("counter").doc("main");

const BASE = 6;

let active = [];
let redSince = [];
let totalTime = 0;
let totalCount = 0;

function init(){
  docRef.get().then(doc=>{
    if(!doc.exists){
      active = Array(BASE).fill(false);
      redSince = Array(BASE).fill(null);
      totalTime = 0;
      totalCount = 0;
      docRef.set({
        value:0,
        boxes:active,
        redSince,
        totalTime,
        totalCount
      });
    }
  });
}

function draw(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  active.forEach((isRed,i)=>{
    const b=document.createElement("button");
    b.className="box";
    b.style.background=isRed?"red":"green";
    b.innerText=i+1;
    b.onclick=()=>toggle(i);
    grid.appendChild(b);
  });

  const allRed = active.length>0 && active.every(v=>v);
  document.getElementById("vol").style.display = allRed ? "flex":"none";

  const avg = totalCount ? Math.floor(totalTime / totalCount) : 0;
  document.getElementById("avg").innerText = msToTime(avg);
}

function toggle(i){
  const now = Date.now();

  docRef.update({ lastAction: firebase.firestore.FieldValue.serverTimestamp() });

  if(!active[i]){
    changeCounter(1);
    redSince[i] = now;
  } else {
    if(redSince[i]){
      totalTime += now - redSince[i];
      totalCount++;
      redSince[i] = null;
    }
  }

  active[i] = !active[i];
  docRef.update({ boxes:active, redSince, totalTime, totalCount });
}

function addBox(){
  active = [...active, false];
  redSince = [...redSince, null];
  docRef.set({ boxes:active, redSince }, { merge:true });
}

function removeBox(){
  if(active.length <= 1) return;
  active.pop();
  redSince.pop();
  docRef.update({ boxes:active, redSince });
}

function resetAll(){
  active = Array(active.length).fill(false);
  redSince = Array(active.length).fill(null);
  docRef.update({ boxes:active, redSince });
}

function changeCounter(amount){
  docRef.update({
    value: firebase.firestore.FieldValue.increment(amount)
  });
  if(amount>0) pop();
}

function manualChange(a){ changeCounter(a); }

function resetCounter(){
  totalTime = 0;
  totalCount = 0;
  docRef.update({
    value: 0,
    totalTime: 0,
    totalCount: 0
  });
}

function pop(){
  const p=document.createElement("div");
  p.className="plus";
  p.innerText="+1";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),600);
}

function msToTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  return `${m}:${(s%60).toString().padStart(2,"0")}`;
}

docRef.onSnapshot(doc=>{
  if(doc.exists){
    const d=doc.data();
    active = d.boxes || Array(BASE).fill(false);
    redSince = d.redSince || Array(active.length).fill(null);
    totalTime = d.totalTime || 0;
    totalCount = d.totalCount || 0;
    document.getElementById("count").innerText = d.value || 0;

    if(d.lastAction){
      document.getElementById("last").innerText =
        d.lastAction.toDate().toLocaleTimeString();
    }

    draw();
  }
});

init();
</script>
</body>
</html>
